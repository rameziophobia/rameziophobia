name: Refresh GitHub stats snapshot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-github-stats.yml'
      - 'scripts/refresh_github_stats.py'
      - 'tests/test_refresh_github_stats.py'

permissions:
  contents: read

concurrency:
  group: github-stats-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'rameziophobia/rameziophobia' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      # This temporary token can update only this public profile repository.
      # It has no access to private contribution data or other repositories.
      contents: write
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Verify snapshot safeguards
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Fetch and validate the aggregate card
        # No PAT or GitHub token is passed to the downloader.
        run: python3 scripts/refresh_github_stats.py

      - name: Publish the successful snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/github-stats.svg; then
            echo 'No stats changes to publish'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/github-stats.svg
          git commit -m 'Update GitHub stats snapshot'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
